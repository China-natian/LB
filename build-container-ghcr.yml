name: Build And Publish Container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "container/**"

permissions:
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The worker image exceeds 20 GB; the default runner has ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./container
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lb-worker-container:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/lb-worker-container:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/lb-worker-container:buildcache,mode=max
